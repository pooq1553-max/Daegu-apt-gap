name: 실거래가 자동 갱신

# 매일 16:00 KST(UTC 07:00) 1회 + 수동 실행
on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 국토부 실거래가 수집·집계
        id: build
        run: |
          set -o pipefail
          if python3 tools/update_data.py --out data/apartments.json --csv-out /tmp/raw.csv; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            # 수집이 막히거나 실패해도 배포본 데이터는 그대로 둔다(깨진 데이터로 덮어쓰지 않음)
            echo "::warning::실거래가 수집 실패 — 기존 data/apartments.json 을 유지합니다."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 데이터 검증
        if: steps.build.outputs.ok == 'true'
        run: |
          python3 - <<'PY'
          import json
          d = json.load(open("data/apartments.json", encoding="utf-8"))
          n = len(d["items"])
          assert n >= 50, f"단지 수 비정상: {n}"
          assert d["meta"]["period_end"], "기준일 없음"
          print(f"검증 OK — {n}개 단지, {d['meta']['period_start']} ~ {d['meta']['period_end']}")
          PY

      - name: 변경이 있으면 커밋
        if: steps.build.outputs.ok == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- data/apartments.json; then
            echo "변경 없음 — 커밋 생략"
            exit 0
          fi
          git add data/apartments.json
          git commit -m "data: 실거래가 자동 갱신 ($(TZ=Asia/Seoul date +%Y-%m-%d))"
          git push
